<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5d50%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3ECV%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1 id="app-title">Team CV</h1>
        <p id="app-subtitle" class="subtitle"></p>
      </div>
      <div class="header-actions">
        <a class="btn btn-ghost" href="/api/export" download>Export YAML</a>
        <button class="btn btn-primary" id="add-btn" type="button">+ Add member</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name, job, city, skill or hobby…" aria-label="Search team members" />
      <span id="count" class="count"></span>
    </div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden></p>
  </main>

  <!-- Member details (READ) -->
  <dialog id="detail-dialog" class="dialog dialog-wide">
    <button type="button" class="icon-btn dialog-close" data-close aria-label="Close">✕</button>
    <div id="detail-content"></div>
  </dialog>

  <!-- Create / edit form (CREATE + UPDATE) -->
  <dialog id="form-dialog" class="dialog dialog-wide">
    <form id="member-form" novalidate>
      <div class="dialog-head">
        <h2 id="form-title">Add team member</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </div>

      <div id="form-errors" class="form-errors" role="alert" hidden></div>

      <fieldset>
        <legend>Personal</legend>
        <div class="photo-field">
          <div id="photo-preview" class="avatar avatar-lg"></div>
          <div class="photo-controls">
            <label class="btn btn-ghost btn-sm">
              Choose photo
              <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
            </label>
            <button id="photo-remove" type="button" class="btn btn-link btn-sm" hidden>Remove photo</button>
            <small class="hint">JPG, PNG, WEBP or GIF</small>
          </div>
        </div>
        <div class="row">
          <label>Full name *<input name="name" required autocomplete="off" /></label>
          <label>Job title *<input name="jobTitle" required /></label>
        </div>
        <div class="row row-3">
          <label>Department<input name="department" /></label>
          <label>Date of birth *<input name="dateOfBirth" type="date" required /></label>
          <label>Nationality<input name="nationality" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact &amp; address</legend>
        <div class="row">
          <label>Email<input name="email" type="email" /></label>
          <label>Phone<input name="phone" type="tel" /></label>
        </div>
        <label>Street<input name="address.street" /></label>
        <div class="row row-3">
          <label>Postal code<input name="address.postalCode" /></label>
          <label>City<input name="address.city" /></label>
          <label>Country<input name="address.country" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>About</legend>
        <label>Short bio<textarea name="bio" rows="3"></textarea></label>
        <label><span>Skills <small class="hint">comma separated</small></span><input name="skills" placeholder="TypeScript, Node.js, YAML" /></label>
        <div class="row">
          <label><span>Languages <small class="hint">comma separated</small></span><input name="languages" placeholder="German, English" /></label>
          <label><span>Hobbies <small class="hint">comma separated</small></span><input name="hobbies" placeholder="Hiking, Chess" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Experience</legend>
        <div id="experience-list" class="experience-list"></div>
        <button id="add-experience" type="button" class="btn btn-ghost btn-sm">+ Add experience</button>
      </fieldset>

      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation (DELETE) -->
  <dialog id="confirm-dialog" class="dialog dialog-small">
    <h2>Delete team member?</h2>
    <p id="confirm-text"></p>
    <div class="dialog-foot">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
    </div>
  </dialog>

  <template id="experience-row">
    <div class="experience-row">
      <div class="row">
        <label>Company<input data-field="company" /></label>
        <label>Position<input data-field="position" /></label>
      </div>
      <div class="row">
        <label>From<input data-field="startDate" type="month" /></label>
        <label><span>To <small class="hint">empty = current</small></span><input data-field="endDate" type="month" /></label>
      </div>
      <label>Description<input data-field="description" /></label>
      <button type="button" class="btn btn-link btn-sm remove-experience">Remove</button>
    </div>
  </template>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/js/client/app.js"></script>
</body>
</html>
